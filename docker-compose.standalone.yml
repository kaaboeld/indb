# Single-node INDB. Same shape as docker run postgres.
#   docker compose -f docker-compose.standalone.yml up
#   docker compose -f docker-compose.standalone.yml run --rm indb tui
services:
  indb:
    build:
      context: .
      args:
        VERSION: ${INDB_VERSION:-0.10.0}
    image: indb:${INDB_VERSION:-0.10.0}
    container_name: indb
    ports:
      - "8000:8000"
      - "9001:9001/udp"
      - "50051:50051"
    environment:
      DATA_DIR: /data
      PORT: 8000
      RAFT_ENABLED: "false"
      # From .env (gitignored). Form: secret:role:user_id
      API_KEYS: ${API_KEYS:-}
    volumes:
      - indb-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  indb-data:
