# pytest configuration for INDB Backend
# The section must be [pytest] in a pytest.ini file; [tool:pytest] belongs to setup.cfg and
# is ignored here, which silently disabled testpaths, asyncio_mode and every marker below.

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    api: API tests
    ml: ML tests (requires ML libraries)
    slow: Slow tests
    asyncio: Async tests

# Coverage (optional)
# addopts = --cov=core --cov=services --cov-report=html
