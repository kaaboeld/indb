# 3-node Raft cluster. Each node is the same product image as standalone.
services:
  indb-node-1:
    build: .
    image: indb:${INDB_VERSION:-0.10.0}
    container_name: indb-node-1
    hostname: indb-node-1
    ports:
      - "8000:8000"
      - "9001:9001/udp"
      - "50051:50051"
    environment:
      RAFT_ENABLED: ${RAFT_ENABLED:-true}
      RAFT_NODE_ID: ${RAFT_NODE_1_ID:-indb-node-1}
      RAFT_PEERS: ${RAFT_NODE_1_PEERS:-http://indb-node-2:8000,http://indb-node-3:8000}
      RAFT_RPC_TOKEN: ${RAFT_RPC_TOKEN:?set RAFT_RPC_TOKEN for multi-node Raft}
      PORT: ${INDB_PORT:-8000}
      DATA_DIR: /data
      INDB_MASTER_KEY: ${INDB_MASTER_KEY:-}
    volumes:
      - ./data-node-1:/data
    networks:
      - indb-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  indb-node-2:
    build: .
    image: indb:${INDB_VERSION:-0.10.0}
    container_name: indb-node-2
    hostname: indb-node-2
    ports:
      - "8004:8000"
      - "9002:9001/udp"
      - "50052:50051"
    environment:
      RAFT_ENABLED: ${RAFT_ENABLED:-true}
      RAFT_NODE_ID: ${RAFT_NODE_2_ID:-indb-node-2}
      RAFT_PEERS: ${RAFT_NODE_2_PEERS:-http://indb-node-1:8000,http://indb-node-3:8000}
      RAFT_RPC_TOKEN: ${RAFT_RPC_TOKEN:?set RAFT_RPC_TOKEN for multi-node Raft}
      PORT: ${INDB_PORT:-8000}
      DATA_DIR: /data
      INDB_MASTER_KEY: ${INDB_MASTER_KEY:-}
    volumes:
      - ./data-node-2:/data
    networks:
      - indb-network
    depends_on:
      - indb-node-1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  indb-node-3:
    build: .
    image: indb:${INDB_VERSION:-0.10.0}
    container_name: indb-node-3
    hostname: indb-node-3
    ports:
      - "8005:8000"
      - "9003:9001/udp"
      - "50053:50051"
    environment:
      RAFT_ENABLED: ${RAFT_ENABLED:-true}
      RAFT_NODE_ID: ${RAFT_NODE_3_ID:-indb-node-3}
      RAFT_PEERS: ${RAFT_NODE_3_PEERS:-http://indb-node-1:8000,http://indb-node-2:8000}
      RAFT_RPC_TOKEN: ${RAFT_RPC_TOKEN:?set RAFT_RPC_TOKEN for multi-node Raft}
      PORT: ${INDB_PORT:-8000}
      DATA_DIR: /data
      INDB_MASTER_KEY: ${INDB_MASTER_KEY:-}
    volumes:
      - ./data-node-3:/data
    networks:
      - indb-network
    depends_on:
      - indb-node-1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  loadbalancer:
    image: haproxy:2.9-alpine
    container_name: indb-loadbalancer
    ports:
      - "8888:80"
      - "8080:8080"
      - "50050:50050"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - indb-network
    depends_on:
      - indb-node-1
      - indb-node-2
      - indb-node-3

  tui:
    image: indb:${INDB_VERSION:-0.10.0}
    profiles:
      - tools
    environment:
      INDB_API_URL: ${INDB_API_URL:-http://loadbalancer:80}
    command: ["tui"]
    stdin_open: true
    tty: true
    networks:
      - indb-network
    depends_on:
      - loadbalancer

networks:
  indb-network:
    driver: bridge
