global
    log stdout format raw local0
    maxconn 4096
    daemon

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms
    option  forwardfor
    option  http-server-close
    retries 2
    option  redispatch

# Stats page (optional, for monitoring)
listen stats
    bind *:8080
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if TRUE

# HTTP/REST API Load Balancer
frontend http_frontend
    bind *:80
    # MCP (SSE) requires sticky sessions — same node for GET /sse and POST /messages
    acl is_mcp path_beg /api/v2/mcp
    use_backend mcp_single if is_mcp
    default_backend indb_nodes

# MCP: single node (sessions in memory, no roundrobin)
# timeout tunnel for long-lived SSE connections
backend mcp_single
    balance roundrobin
    timeout tunnel 1h
    option httpchk GET /health
    http-check expect status 200
    server node1 indb-node-1:8000 check inter 2000ms rise 2 fall 3

backend indb_nodes
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    
    # Health: 2s interval, 2 failures = down, 2 successes = up
    # All nodes serve reads; writes hit leader (followers proxy automatically)
    server node1 indb-node-1:8000 check inter 2000ms rise 2 fall 3
    server node2 indb-node-2:8000 check inter 2000ms rise 2 fall 3
    server node3 indb-node-3:8000 check inter 2000ms rise 2 fall 3

# gRPC Load Balancer (if needed)
frontend grpc_frontend
    bind *:50050
    mode tcp
    default_backend grpc_nodes

backend grpc_nodes
    mode tcp
    balance leastconn
    
    server node1 indb-node-1:50051 check
    server node2 indb-node-2:50051 check
    server node3 indb-node-3:50051 check
