# fly.toml app configuration file generated for indb-little-frog-2154 on 2026-03-04T09:04:57+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'indb'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATA_DIR = '/data'
  INDB_HOST = '0.0.0.0'
  INDB_PORT = '8000'
  LOG_LEVEL = 'INFO'
  PORT = '8000'
  RAFT_ENABLED = 'false'
  # Dedicated Fly IPv4 for UDP/gRPC (shared ingress is HTTP-only).
  INDB_PUBLIC_HOST = '137.66.0.37'
  INDB_PUBLIC_HTTP = 'https://api.indb.tech'
  UDP_PORT = '9001'

[[mounts]]
  source = 'indb_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 500
    soft_limit = 400

[[services]]
  protocol = 'udp'
  internal_port = 9001

  [[services.ports]]
    port = 9001

# gRPC is plain TCP on 50051. Clients reach it via the app's public IP or
# indb.fly.dev — not api.indb.tech, which is HTTP-only.
[[services]]
  protocol = 'tcp'
  internal_port = 50051

  [[services.ports]]
    port = 50051

[[vm]]
  memory = '2gb'
  cpus = 2
  memory_mb = 2048
