apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "indb.fullname" . }}
  labels:
    {{- include "indb.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "indb.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "indb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "indb.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: indb
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.service.port }}
          protocol: TCP
        - name: udp
          containerPort: {{ .Values.service.udpPort }}
          protocol: UDP
        - name: grpc
          containerPort: {{ .Values.service.grpcPort }}
          protocol: TCP
        env:
        {{- range .Values.env }}
        - name: {{ .name }}
          value: {{ .value | quote }}
        {{- end }}
        {{- if .Values.raft.enabled }}
        - name: RAFT_NODE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: RAFT_PEERS
          value: {{ .Values.raft.peers | quote }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
        volumeMounts:
        - name: data
          mountPath: /app/data
        {{- if .Values.ssl.enabled }}
        - name: certs
          mountPath: /certs
          readOnly: true
        {{- end }}
      volumes:
      {{- if .Values.ssl.enabled }}
      - name: certs
        secret:
          secretName: {{ include "indb.fullname" . }}-tls
      {{- end }}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ {{ .Values.persistence.accessMode | quote }} ]
      {{- if .Values.persistence.storageClass }}
      storageClassName: {{ .Values.persistence.storageClass | quote }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.persistence.size | quote }}
